publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  http: ^1.6.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
